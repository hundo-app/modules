api = 3

[driver]
id = "hades"
name = "Hades"
version = "0.1.0-alpha"
authors = ["Arnaud Michel"]
license = "MIT OR Apache-2.0"
description = "Armes et Aspects, Liste du destin complète, Miroir de la Nuit, relations, souvenirs et compagnons, Constructeur."

[game]
steam-app-id = 1145360
tested-versions = ["38290"]

[[locations]]
platform = "windows"
path = "{documents}/Saved Games/Hades"

[[locations]]
platform = "macos"
path = "{appSupport}/Supergiant Games/Hades"

# Profile1_Temp.sav and Profile1.v.sav are the game's working copies.
[slots]
kind = "file"
pattern = '^Profile(?<slot>[1-4])\.sav$'
label = "Profil {slot}"

# The game's own names for things, read from the installed game in the
# reader's language: its text files are plain, in a format of their own.
[texts]
kind = "files"
files = ["Content/Game/Text/{lang}/HelpText.{lang}.sjson"]
